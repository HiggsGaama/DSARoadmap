<!-- MathJax: renders $...$ (inline) and $$...$$ (display) complexity notation on GitHub Pages. -->
<script>
  window.MathJax = {
    tex: {
      inlineMath: [["$", "$"], ["\\(", "\\)"]],
      displayMath: [["$$", "$$"], ["\\[", "\\]"]]
    },
    options: { skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"] }
  };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>

  details { margin: 1rem 0; padding: 0.5rem 1rem; border: 1px solid #dce6f0; border-radius: 6px; background: #f8fafc; }
  details > summary { cursor: pointer; font-weight: 600; }
  details[open] > summary { margin-bottom: 0.75rem; }
</style>
